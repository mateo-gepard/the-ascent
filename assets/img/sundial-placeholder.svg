<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Sundial diagram">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161c"/><stop offset="1" stop-color="#080a0d"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#g)"/>
  <g transform="translate(320 232)" fill="none" stroke="#9aa0a8" stroke-linecap="round">
    <!-- hour lines -->
    <g stroke-width="1" opacity=".5">
      <line x1="0" y1="0" x2="-150" y2="0"/><line x1="0" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="0" x2="-145" y2="-39"/><line x1="0" y1="0" x2="145" y2="-39"/>
      <line x1="0" y1="0" x2="-130" y2="-75"/><line x1="0" y1="0" x2="130" y2="-75"/>
      <line x1="0" y1="0" x2="-106" y2="-106"/><line x1="0" y1="0" x2="106" y2="-106"/>
      <line x1="0" y1="0" x2="-75" y2="-130"/><line x1="0" y1="0" x2="75" y2="-130"/>
      <line x1="0" y1="0" x2="-39" y2="-145"/><line x1="0" y1="0" x2="39" y2="-145"/>
      <line x1="0" y1="0" x2="0" y2="-150"/>
    </g>
    <!-- dial arc -->
    <path d="M-160 0 A160 160 0 0 1 160 0" stroke="#f4f5f7" stroke-width="1.4" opacity=".9"/>
    <!-- gnomon (angled to latitude) -->
    <path d="M0 0 L96 -112 L0 -112 Z" fill="#f4f5f7" fill-opacity=".10" stroke="#f4f5f7" stroke-width="1.4"/>
    <!-- shadow -->
    <line x1="0" y1="0" x2="-118" y2="-96" stroke="#e0e4e8" stroke-width="2.4" opacity=".85"/>
    <circle cx="0" cy="0" r="3.2" fill="#f4f5f7" stroke="none"/>
  </g>
  <text x="34" y="46" fill="#62676e" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2.4">APPARENT SOLAR TIME</text>
  <text x="34" y="66" fill="#9aa0a8" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.2">≠ CLOCK TIME</text>
</svg>
